[tool.poetry]
name = "yolov7-mit"
version = "0.1.0"
description = "MultimediaTechLab/YOLO (MIT-licensed), patched for yolov7x weight compatibility and CPU/OpenVINO inference"
authors = ["Ran Katzir <ran.katzir@valerann.com>"]
packages = [{ include = "yolo" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
einops = "0.8.2"
faster-coco-eval = "1.7.2"
hydra-core = "1.3.5"
lightning = "2.6.5"
loguru = "0.7.3"
numpy = "2.5.2"
opencv-python-headless = "5.0.0.93"
Pillow = "12.3.0"
pycocotools = "2.0.11"
requests = "2.34.2"
rich = "15.0.0"
torch = "2.13.0"
torchvision = "0.28.0"
wandb = "0.28.2"

[tool.poetry.group.openvino]
optional = true

[tool.poetry.group.openvino.dependencies]
onnx = "1.22.0"
onnxscript = "0.7.1"
openvino = "2026.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
